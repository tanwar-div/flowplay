# Round-robins across however many API replicas are running.
#
# Docker's embedded DNS resolves a Compose service name to the addresses of all its
# containers, but nginx resolves an upstream once at startup by default — so a replica
# started later would never receive traffic. Resolving through a variable with an
# explicit resolver and a short TTL makes nginx re-resolve, which is what lets
# `docker compose up --scale api=4` actually distribute load.

events {
    worker_connections 4096;
}

http {
    access_log off;

    # Docker's embedded DNS server.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        # Keepalive to the upstreams, so the load generator's connection reuse is not
        # undone by a new TCP connection per proxied request.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The idempotency header must survive the hop, or every retry would look like a
        # fresh request to the API behind it.
        proxy_pass_request_headers on;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;

        location / {
            set $api_upstream "http://api:8080";
            proxy_pass $api_upstream;
        }
    }
}
